# Serves the React build and load-balances /api and /socket.io across every `api` replica.
# Docker's DNS returns one A record per replica; `resolver` + a variable makes nginx re-resolve
# periodically, so `docker compose up --scale api=N` works without restarting nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    set $api http://api:5000;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_next_upstream error timeout http_502 http_503;   # a replica restarting is invisible to users
  }

  location /socket.io/ {
    set $api http://api:5000;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;   # websockets are long-lived; the client heartbeats well inside this
  }

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { try_files $uri /index.html; }   # SPA fallback for client-side routes
}
